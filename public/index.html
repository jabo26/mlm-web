<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Corrientes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#00C896" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Corrientes" />
<!-- cache-busting: subir ?v= en cada cambio de style.css/app.js para saltar el cache de Cloudflare -->
<link rel="stylesheet" href="style.css?v=8" />
<script>
  /* Fija el tema ANTES de pintar para evitar el flash de blanco */
  (function () {
    try {
      var t = localStorage.getItem('cor_theme') ||
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div id="app"></div>
  <script src="app.js?v=8"></script>
</body>
</html>
